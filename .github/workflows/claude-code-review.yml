name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # Read/Grep/Glob are read-only and let the reviewer open the code
          # around a diff instead of reasoning from the diff alone. Without
          # them every file access was refused: the last run before this change
          # reported "permission_denials_count": 2.
          # Task is disallowed so the reviewer cannot delegate. Left to itself
          # it spawns background review agents and then ends its turn to wait
          # for them -- but a CI run has no next turn, so the action exits and
          # kills them with their findings. Both runs after Read/Grep/Glob were
          # added ended that way and posted nothing:
          #   #25  spawned 7, completed 5, "I'll wait for the remaining three
          #        background review agents to complete naturally"
          #   #26  spawned 4, completed 2, "Both review agents ... are still
          #        running in the background"
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment,Read,Grep,Glob" --disallowedTools "Task"'
          # Otherwise the run log only carries an init and a result block, and
          # the review itself is visible nowhere but the PR comments.
          show_full_output: true
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

